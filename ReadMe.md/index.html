<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Web Programming - Asilbek</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            margin: 0;
            padding: 60px 20px;
            text-align: center;
        }

        .container {
            max-width: 700px;
            margin: auto;
        }

        h1 {
            margin-bottom: 10px;
        }

        .description {
            color: #666;
            margin-bottom: 40px;
        }

        .weeks {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .week {
            display: block;
            background: white;
            color: #222;
            text-decoration: none;
            padding: 22px;
            border-radius: 12px;
            font-size: 20px;
            font-weight: bold;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            transition: 0.2s;
        }

        .week:hover {
            background: #e9e9e9;
            transform: translateY(-2px);
        }

        .footer {
            margin-top: 40px;
            color: #888;
            font-size: 14px;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>Web Programming</h1>

        <p class="description">
            My Web Programming assignments and class exercises
        </p>

        <div class="weeks">

            <a class="week" href="Week2/">
                Week 2
            </a>

            <a class="week" href="Week3/">
                Week 3
            </a>

            <a class="week" href="Week4/">
                Week 4
            </a>

        </div>

        <div class="footer">
            <p>Created by Asilbek</p>
        </div>

    </div>

</body>
</html>
