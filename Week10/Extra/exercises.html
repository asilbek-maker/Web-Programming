<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Week 10 extra exercises.">
    <title>Week 10 Extra Exercises</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            padding: 36px 16px;
            background: #f1f1f4;
            color: #171717;
            font-family: Arial, sans-serif;
        }
        main { width: min(100%, 1400px); margin: 0 auto; }
        .exercise-list { display: grid; gap: 24px; }
        .exercise-card {
            display: grid;
            min-height: 126px;
            place-items: center;
            border: 1px solid #e8e8ec;
            border-radius: 20px;
            background: #fcfdff;
            box-shadow: 0 7px 18px rgb(0 0 0 / 9%);
        }
        .exercise-card h1 {
            margin: 0;
            font-size: clamp(1.7rem, 4vw, 2.3rem);
            font-weight: 700;
            text-align: center;
        }
        .exercise-card:focus-visible { outline: 3px solid #31869a; outline-offset: 4px; }
        .page-links { display: flex; justify-content: center; gap: 24px; margin: 28px 0 0; }
        .page-links a { color: #176578; text-underline-offset: 3px; }
        .page-links a:focus-visible { outline: 3px solid #31869a; outline-offset: 4px; }
        @media (max-width: 520px) {
            body { padding: 20px 12px; }
            .exercise-list { gap: 16px; }
            .exercise-card { min-height: 104px; border-radius: 16px; }
        }
    </style>
</head>
<body>
    <main>
        <section class="exercise-list" aria-label="Week 10 exercises">
            <article class="exercise-card"><h1>Exercise 1</h1></article>
            <article class="exercise-card"><h1>Exercise 2</h1></article>
            <article class="exercise-card"><h1>Exercise 3</h1></article>
            <article class="exercise-card"><h1>Exercise 4</h1></article>
        </section>
        <nav class="page-links" aria-label="Week 10 navigation">
            <a href="index.html">Back to Book Search</a>
            <a href="../index.html">Back to Week 10</a>
        </nav>
    </main>
</body>
</html>
