<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Search the Open Library catalog by title, author, or subject.">
    <meta name="theme-color" content="#f3f3f6">
    <title>Book Search — Week 10 Extra Task</title>
    <style>
        :root {
            color-scheme: light;
            --page: #f3f3f6;
            --surface: #fff;
            --surface-soft: #f8fafc;
            --text: #172033;
            --muted: #5b6475;
            --accent: #31869a;
            --accent-dark: #276e7e;
            --border: #d5dce7;
            --error: #a43d38;
        }
        * { box-sizing: border-box; }
        body {
            min-height: 100vh;
            margin: 0;
            padding: 40px 22px 56px;
            background: var(--page);
            color: var(--text);
            font-family: Arial, sans-serif;
            line-height: 1.5;
        }
        main { width: min(100%, 1040px); margin: 0 auto; }
        .skip-link {
            position: absolute;
            top: 12px;
            left: 12px;
            z-index: 1;
            padding: 10px 14px;
            transform: translateY(-160%);
            background: var(--surface);
            color: var(--text);
        }
        .skip-link:focus { transform: translateY(0); }
        header { margin: 0 auto 30px; text-align: center; }
        .eyebrow {
            margin: 0 0 8px;
            color: var(--muted);
            font-size: .9rem;
            font-weight: 700;
            letter-spacing: .08em;
            text-transform: uppercase;
        }
        h1 { margin: 0 0 10px; font-size: clamp(2.25rem, 6vw, 3.25rem); line-height: 1.15; }
        .intro { max-width: 620px; margin: 0 auto; color: var(--muted); font-size: 1.1rem; }
        .search-panel {
            display: flex;
            gap: 12px;
            margin: 28px 0 16px;
        }
        .search-panel label {
            position: absolute;
            width: 1px;
            height: 1px;
            overflow: hidden;
            clip: rect(0, 0, 0, 0);
            white-space: nowrap;
        }
        .search-panel input {
            min-width: 0;
            min-height: 58px;
            flex: 1;
            padding: 0 18px;
            border: 1px solid var(--border);
            border-radius: 12px;
            background: var(--surface);
            color: var(--text);
            font: inherit;
            font-size: 1rem;
        }
        .search-panel input::placeholder { color: #70798a; }
        button {
            min-width: 160px;
            min-height: 58px;
            padding: 0 22px;
            border: 0;
            border-radius: 12px;
            background: var(--accent);
            color: #fff;
            font: inherit;
            font-weight: 700;
            cursor: pointer;
            transition: background-color .18s ease, transform .18s ease;
        }
        button:hover:not(:disabled) { transform: translateY(-1px); background: var(--accent-dark); }
        button:disabled { cursor: wait; opacity: .7; }
        :focus-visible { outline: 3px solid var(--accent-dark); outline-offset: 3px; }
        #status { min-height: 26px; margin: 0 0 20px; color: var(--muted); text-align: center; }
        #status.error { color: var(--error); }
        .results {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(min(100%, 220px), 1fr));
            gap: 18px;
        }
        .book-card {
            min-width: 0;
            overflow: hidden;
            border: 1px solid var(--border);
            border-radius: 14px;
            background: var(--surface);
            box-shadow: 0 3px 8px rgb(23 32 51 / 7%);
        }
        .cover-wrap {
            display: grid;
            min-height: 230px;
            place-items: center;
            padding: 18px;
            background: var(--surface-soft);
        }
        .cover { display: block; width: auto; max-width: 100%; height: 200px; object-fit: contain; }
        .cover-placeholder { color: var(--muted); font-size: .95rem; text-align: center; }
        .book-info { padding: 16px; }
        .book-info h2 { margin: 0 0 9px; font-size: 1.08rem; line-height: 1.4; }
        .book-info p { margin: 7px 0; color: var(--muted); }
        .book-info a { display: inline-block; margin-top: 9px; color: var(--accent-dark); font-weight: 700; text-underline-offset: 3px; }
        .skeleton {
            min-height: 330px;
            border: 1px solid var(--border);
            border-radius: 14px;
            background: linear-gradient(100deg, var(--surface) 30%, var(--surface-soft) 50%, var(--surface) 70%);
            background-size: 200% 100%;
            animation: shimmer 1.4s ease-in-out infinite;
        }
        @keyframes shimmer { to { background-position-x: -200%; } }
        .back-link { display: block; margin-top: 34px; color: var(--accent-dark); text-align: center; text-underline-offset: 3px; }
        .credit { margin: 18px 0 0; color: var(--muted); font-size: .85rem; text-align: center; }
        @media (max-width: 540px) {
            body { padding: 28px 16px 40px; }
            .search-panel { flex-direction: column; }
            .search-panel input, button { width: 100%; min-height: 54px; }
        }
        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after { scroll-behavior: auto !important; transition-duration: .01ms !important; }
            .skeleton { animation-duration: .01ms; }
        }
    </style>
</head>
<body>
    <a class="skip-link" href="#main-content">Skip to main content</a>
    <main id="main-content" tabindex="-1">
        <header>
            <p class="eyebrow">Week 10 · Extra Task</p>
            <h1>Book Search</h1>
            <p class="intro">Find your next read in the Open Library catalog. Search by book title, author, or subject.</p>
        </header>

        <form class="search-panel" id="search-form">
            <label for="search-input">Search books by title, author, or subject</label>
            <input id="search-input" name="q" type="search" placeholder="Try a title, author, or subject" minlength="2" required>
            <button id="search-button" type="submit">Search books</button>
        </form>
        <p id="status" role="status" aria-live="polite">Enter at least 2 characters to search.</p>
        <section class="results" id="results" aria-label="Book search results" aria-busy="false"></section>
        <p class="credit">Book information and covers provided by Open Library.</p>
        <a class="back-link" href="exercises.html">View Exercises 1–3</a>
        <a class="back-link" href="../index.html">Back to Week 10</a>
    </main>

    <script>
        const form = document.getElementById('search-form');
        const input = document.getElementById('search-input');
        const button = document.getElementById('search-button');
        const status = document.getElementById('status');
        const results = document.getElementById('results');
        let isLoading = false;

        function showMessage(message) {
            const placeholder = document.createElement('p');
            placeholder.className = 'cover-placeholder';
            placeholder.textContent = message;
            results.replaceChildren(placeholder);
        }

        function makeBookCard(book) {
            const card = document.createElement('article');
            card.className = 'book-card';

            const coverWrap = document.createElement('div');
            coverWrap.className = 'cover-wrap';
            if (Number.isInteger(book.cover_i)) {
                const cover = document.createElement('img');
                cover.className = 'cover';
                cover.src = `https://covers.openlibrary.org/b/id/${book.cover_i}-M.jpg`;
                cover.alt = `Cover of ${book.title || 'this book'}`;
                cover.loading = 'lazy';
                cover.addEventListener('error', () => {
                    const placeholder = document.createElement('span');
                    placeholder.className = 'cover-placeholder';
                    placeholder.textContent = 'Cover not available';
                    cover.replaceWith(placeholder);
                }, { once: true });
                coverWrap.appendChild(cover);
            } else {
                const placeholder = document.createElement('span');
                placeholder.className = 'cover-placeholder';
                placeholder.textContent = 'Cover not available';
                coverWrap.appendChild(placeholder);
            }

            const info = document.createElement('div');
            info.className = 'book-info';
            const title = document.createElement('h2');
            title.textContent = typeof book.title === 'string' && book.title ? book.title : 'Untitled';
            info.appendChild(title);

            const author = document.createElement('p');
            const authors = Array.isArray(book.author_name)
                ? book.author_name.filter((name) => typeof name === 'string').slice(0, 2).join(', ')
                : '';
            author.textContent = authors ? `By ${authors}` : 'Author unknown';
            info.appendChild(author);

            if (Number.isInteger(book.first_publish_year)) {
                const year = document.createElement('p');
                year.textContent = `First published ${book.first_publish_year}`;
                info.appendChild(year);
            }

            if (typeof book.key === 'string' && /^\/works\/[A-Za-z0-9]+$/.test(book.key)) {
                const link = document.createElement('a');
                link.href = `https://openlibrary.org${book.key}`;
                link.target = '_blank';
                link.rel = 'noopener noreferrer';
                link.textContent = 'View book details';
                info.appendChild(link);
            }

            card.append(coverWrap, info);
            return card;
        }

        form.addEventListener('submit', async (event) => {
            event.preventDefault();
            if (isLoading) return;

            const query = input.value.trim();
            if (query.length < 2) {
                status.classList.add('error');
                status.textContent = 'Enter at least 2 characters to search.';
                input.focus();
                return;
            }

            isLoading = true;
            button.disabled = true;
            input.disabled = true;
            results.setAttribute('aria-busy', 'true');
            status.classList.remove('error');
            status.textContent = 'Searching the catalog...';
            results.replaceChildren(...Array.from({ length: 6 }, () => {
                const skeleton = document.createElement('div');
                skeleton.className = 'skeleton';
                skeleton.setAttribute('aria-hidden', 'true');
                return skeleton;
            }));

            try {
                const params = new URLSearchParams({ q: query, limit: '12' });
                const response = await fetch(`https://openlibrary.org/search.json?${params}`);
                if (!response.ok) throw new Error(`Book search failed with status ${response.status}`);

                const data = await response.json();
                if (!data || !Array.isArray(data.docs)) throw new Error('The book search returned an unexpected response.');

                const books = data.docs.filter((book) => book && typeof book === 'object');
                if (books.length === 0) {
                    showMessage('No books found. Try a different title or author.');
                    status.textContent = 'No books found.';
                    return;
                }

                results.replaceChildren(...books.map(makeBookCard));
                status.textContent = `Showing ${books.length} ${books.length === 1 ? 'book' : 'books'} for "${query}".`;
            } catch {
                showMessage('Search results could not be displayed.');
                status.classList.add('error');
                status.textContent = 'Could not load books. Check your connection and try again.';
            } finally {
                isLoading = false;
                button.disabled = false;
                input.disabled = false;
                results.setAttribute('aria-busy', 'false');
                input.focus();
            }
        });
    </script>
</body>
</html>
