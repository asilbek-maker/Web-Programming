<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <style>
    body {
      font-family: sans-serif;
      background-color: #f0fdf4;
    }

    h1 {
      color: #15803d;
      font-size: 2rem;
      text-align: center;
    }

    p {
      line-height: 1.7;
      color: #334155;
    }

    /* This is a comment */
    .highlight {
      background-color: #dcfce7;
    }
  </style>
</head>
<body>
  <h1>Already Fixed CSS</h1>
  <p>This paragraph has <span class="highlight">working CSS</span> around it. The background color is applied correctly.</p>
</body>
</html>
