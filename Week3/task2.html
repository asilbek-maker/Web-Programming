<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <style>
    .card {
      width: 280px;
      height: 180px;
      background-color: white;
      border: 2px solid #0f766e;
      border-radius: 12px;
      position: relative;
      margin: 40px;

      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }

    .card:hover {
      transform: translateY(-6px);
      box-shadow: 0 12px 24px rgba(15, 118, 110, 0.25);
    }

    .badge {
      position: absolute;
      top: -12px;
      right: -12px;
      background: #0f766e;
      color: white;
      font-size: 12px;
      font-weight: bold;
      padding: 4px 12px;
      border-radius: 9999px;
    }
  </style>
</head>
<body>
  <div class="card">
    <span class="badge">SALE</span>
    <p style="padding: 32px;">Costco Card</p>
  </div>
</body>
</html>
