<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<style>
  /* :root variables */
  :root {
    --primary: #0f766e;
    --accent: #14b8a6;
    --bg: #f0fdfa;
    --text: #1e293b;
    --card-bg: #ffffff;
    --radius: 12px;
  }

  /* Universal reset */
  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  /* Body styles */
  body {
    background: var(--bg);
    color: var(--text);
    font-family: system-ui, -apple-system, sans-serif;
    padding: 24px;
  }

  h1 {
    margin-bottom: 24px;
    color: var(--primary);
  }

  /* .grid — 1 column base layout with gap */
  .grid {
    display: grid;
    grid-template-columns: 1fr;
    gap: 20px;
  }

  /* Responsive layout — 3 columns at 640px+ */
  @media (min-width: 640px) {
    .grid {
      grid-template-columns: repeat(3, 1fr);
    }
  }

  /* .card — base styling & smooth transitions */
  .card {
    background: var(--card-bg);
    border: 2px solid var(--accent);
    border-radius: var(--radius);
    padding: 20px;
    font-size: 16px;
    font-weight: 600;
    transition: transform 0.25s ease, box-shadow 0.25s ease;
  }

  /* .card:hover — lift effect */
  .card:hover {
    transform: translateY(-6px);
    box-shadow: 0 10px 20px rgba(15, 118, 110, 0.15);
  }

  /* .card[data-icon]::before — icon pseudo-element */
  .card[data-icon]::before {
    content: attr(data-icon) ' ';
    font-size: 2rem;
    display: block;
    margin-bottom: 8px;
  }

  /* Dark mode scheme override */
  @media (prefers-color-scheme: dark) {
    :root {
      --primary: #2dd4bf;
      --accent: #14b8a6;
      --bg: #0f172a;
      --card-bg: #1e293b;
      --text: #f8fafc;
    }
  }
</style>
</head>
<body>
  <h1>My Skills</h1>
  <div class="grid">
    <div class="card" data-icon="🌐">HTML5 — Structure</div>
    <div class="card" data-icon="🎨">CSS3 — Styling</div>
    <div class="card" data-icon="⚡">JavaScript — Behaviour</div>
    <div class="card" data-icon="📐">Flexbox — 1D Layout</div>
    <div class="card" data-icon="🗂">Grid — 2D Layout</div>
    <div class="card" data-icon="📱">Responsive — Any Screen</div>
  </div>
</body>
</html>
