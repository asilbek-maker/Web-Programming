<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>My CSS Advanced Page</title>
<style>
  :root {
    --primary: #0f766e;
    --accent: #14b8a6;
    --bg: #f0fdfa;
    --card-bg: #ffffff;
    --text: #1e293b;
    --radius: 12px;
    --shadow: 0 4px 12px rgba(0, 0, 0, 0.08);
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --primary: #2dd4bf;
      --accent: #14b8a6;
      --bg: #0f172a;
      --card-bg: #1e293b;
      --text: #f8fafc;
      --shadow: 0 4px 12px rgba(0, 0, 0, 0.4);
    }
  }

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: system-ui, -apple-system, sans-serif;
    line-height: 1.6;
  }

  nav {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    background: #1e293b;
    color: white;
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 16px 32px;
    z-index: 1000;
  }

  nav span {
    font-weight: bold;
    font-size: 1.1rem;
    letter-spacing: 0.5px;
  }

  nav a {
    color: #cbd5e1;
    text-decoration: none;
    margin-left: 20px;
    transition: color 0.2s ease;
  }

  nav a:hover {
    color: var(--accent);
  }

  @keyframes fadeIn {
    from {
      opacity: 0;
      transform: translateY(20px);
    }
    to {
      opacity: 1;
      transform: translateY(0);
    }
  }

  .hero {
    padding-top: 140px;
    padding-bottom: 60px;
    text-align: center;
    animation: fadeIn 1s ease-out forwards;
  }

  .hero h1 {
    font-size: 2.5rem;
    color: var(--primary);
    margin-bottom: 8px;
  }

  .hero p {
    font-size: 1.1rem;
    opacity: 0.85;
  }

  .skills-section {
    padding: 0 24px 80px;
    max-width: 900px;
    margin: 0 auto;
  }

  .sticky-h2 {
    position: sticky;
    top: 55px;
    background: var(--bg);
    padding: 16px 0;
    font-size: 1.8rem;
    color: var(--primary);
    z-index: 10;
    border-bottom: 2px solid var(--accent);
    margin-bottom: 24px;
  }

  .grid {
    display: grid;
    grid-template-columns: 1fr;
    gap: 20px;
  }

  @media (min-width: 640px) {
    .grid {
      grid-template-columns: repeat(3, 1fr);
    }
  }

  .card {
    background: var(--card-bg);
    border: 2px solid var(--accent);
    border-radius: var(--radius);
    padding: 24px;
    font-weight: 600;
    box-shadow: var(--shadow);
    transition: transform 0.25s ease, box-shadow 0.25s ease;
  }

  .card:hover {
    transform: translateY(-6px);
    box-shadow: 0 12px 24px rgba(15, 118, 110, 0.2);
  }

  .card[data-icon]::before {
    content: attr(data-icon);
    display: block;
    font-size: 2.2rem;
    margin-bottom: 12px;
  }
</style>
</head>
<body>
  <nav>
    <span>Asilbek</span>
    <div>
      <a href="#home">Home</a>
      <a href="#skills">Skills</a>
    </div>
  </nav>

  <section class="hero" id="hero">
    <h1>Hello, I am Asilbek</h1>
    <p>Computer Science · Gachon University · Week 3 CSS Advanced</p>
  </section>

  <section class="skills-section" id="skills">
    <h2 class="sticky-h2">My Skills</h2>
    <div class="grid">
      <div class="card" data-icon="🌐">HTML5</div>
      <div class="card" data-icon="🐍">Python</div>
      <div class="card" data-icon="⚡">JavaScript</div>
    </div>
  </section>
</body>
</html>
