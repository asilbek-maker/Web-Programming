<!DOCTYPE html>
<html><body style="font-family:system-ui;padding:20px;max-width:420px;margin:auto">
  <style>
    h2 { color: #1a56db; }
    #search { width:100%; padding:10px 14px; font-size:16px;
      border:2px solid #1a56db; border-radius:10px; margin-bottom:14px; box-sizing:border-box; }
    .student { padding:10px 14px; margin-bottom:6px; background:#f0f4ff;
      border-radius:8px; border:1px solid #c8d4f0; font-size:15px; }
    mark { background: #f7df1e; border-radius: 3px; padding: 0 2px; }
    #no-results { display:none; color:#9ca3af; text-align:center; padding:20px; }
  </style>

  <h2>Student Search</h2>
  <input id="search" type="text" placeholder="Search students...">
  <div id="student-list">
    <div class="student" data-name="Kim Jisoo"> Rahimjon — Web Programming</div>
    <div class="student" data-name="Park Minjun">Shuhratxon — Computer Science</div>
    <div class="student" data-name="Lee Sooyeon">Xurshidbek — Software Engineering</div>
    <div class="student" data-name="Choi Hyunwoo">Muhammad — Artificial Intelligence</div>
    <div class="student" data-name="Jung Yuna">G'ayratjon — Data Science</div>
    <div class="student" data-name="Kang Seojun">MuhammadSodiq — Web Programming</div>
  </div>
  <p id="no-results">No students found.</p>

  <script>
    const searchInput = document.querySelector('#search');
    const students = document.querySelectorAll('.student');
    const noResults = document.querySelector('#no-results');

    const originalTextMap = new Map();
    students.forEach((student) => {
      originalTextMap.set(student, student.textContent);
    });

    function escapeRegExp(string) {
      return string.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
    }

    searchInput.addEventListener('input', (e) => {
      const term = e.target.value.trim().toLowerCase();
      let visibleCount = 0;

      students.forEach((student) => {
        const name = student.getAttribute('data-name').toLowerCase();
        const originalText = originalTextMap.get(student);

        if (term === '' || name.includes(term)) {
          student.style.display = '';
          visibleCount++;

          if (term !== '') {
            const regex = new RegExp(`(${escapeRegExp(e.target.value.trim())})`, 'gi');
            student.innerHTML = originalText.replace(regex, '<mark>$1</mark>');
          } else {
            student.textContent = originalText;
          }
        } else {
          student.style.display = 'none';
        }
      });

      noResults.style.display = visibleCount === 0 ? 'block' : 'none';
    });
  </script>
</body></html>
