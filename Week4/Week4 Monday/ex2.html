<!DOCTYPE html>
<html><body style="font-family:system-ui;padding:24px;display:flex;justify-content:center;background:#f3f4f6">
  <style>
    .card {
      width: 300px;
      padding: 24px;
      border-radius: 12px;
      background: #ffffff;
      color: #1f2937;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
      text-align: center;
      transition: background 0.3s, color 0.3s;
    }
    .card.dark {
      background: #1f2937;
      color: #f9fafb;
    }
  </style>

  <div id="profile-card" class="card">
    <h2>Asilbek</h2>
    <p style="opacity: 0.8">Frontend Developer</p>
    
    <button id="theme-toggle" style="
      margin-top: 16px;
      padding: 10px 20px;
      font-size: 14px;
      border: none;
      border-radius: 6px;
      background: #3b82f6;
      color: white;
      cursor: pointer">
      Switch to Dark Mode
    </button>
  </div>

  <script>
    const card = document.querySelector('#profile-card');
    const toggleBtn = document.querySelector('#theme-toggle');

    toggleBtn.addEventListener('click', () => {
      card.classList.toggle('dark');

      if (card.classList.contains('dark')) {
        toggleBtn.textContent = 'Switch to Light Mode';
      } else {
        toggleBtn.textContent = 'Switch to Dark Mode';
      }
    });
  </script>
</body></html>
