<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Week 5 Friday - Web Programming</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            margin: 0;
            padding: 50px 20px;
            text-align: center;
        }

        .container {
            max-width: 700px;
            margin: auto;
        }

        h1 {
            margin-bottom: 10px;
        }

        p {
            color: #666;
            margin-bottom: 35px;
        }

        .tasks {
            max-width: 600px;
            margin: auto;
        }

        .task {
            display: block;
            background: white;
            color: #222;
            text-decoration: none;
            padding: 18px;
            margin: 12px 0;
            border-radius: 10px;
            font-size: 18px;
            font-weight: bold;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            transition: 0.2s;
        }

        .task:hover {
            background: #e9e9e9;
            transform: translateY(-2px);
        }

        .loading {
            color: #777;
            font-size: 18px;
        }

        .error {
            color: #d00;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>Week 5 Friday</h1>

        <p>My Week 5 Friday exercises</p>

        <div class="tasks" id="tasks">
            <div class="loading">Loading exercises...</div>
        </div>

    </div>


    <script>

        const username = "asilbek-maker";
        const repository = "Web-Programming";

        const folder = "Week5 Friday";

        const apiURL =
            `https://api.github.com/repos/${username}/${repository}/contents/${encodeURIComponent(folder)}?ref=main`;

        const tasksContainer = document.getElementById("tasks");


        fetch(apiURL)
            .then(response => {

                if (!response.ok) {
                    throw new Error("Could not load exercises.");
                }

                return response.json();

            })

            .then(files => {

                tasksContainer.innerHTML = "";

                const htmlFiles = files
                    .filter(file =>
                        file.type === "file" &&
                        file.name.toLowerCase().endsWith(".html") &&
                        file.name.toLowerCase() !== "index.html"
                    )
                    .sort((a, b) =>
                        a.name.localeCompare(b.name, undefined, {
                            numeric: true
                        })
                    );


                if (htmlFiles.length === 0) {

                    tasksContainer.innerHTML =
                        '<div class="loading">No exercises found.</div>';

                    return;
                }


                htmlFiles.forEach((file, index) => {

                    const link = document.createElement("a");

                    link.className = "task";

                    link.href = encodeURIComponent(file.name);

                    link.textContent =
                        `📚 Exercise ${index + 1} — ${file.name}`;

                    tasksContainer.appendChild(link);

                });

            })

            .catch(error => {

                tasksContainer.innerHTML =
                    '<div class="error">Could not load exercises.</div>';

                console.error(error);

            });

    </script>

</body>
</html>
