<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Week 6_2 — Task 3</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #eef2ff, #f8fafc);
            margin: 0;
            padding: 40px 20px;
        }
        main {
            max-width: 700px;
            margin: 0 auto;
            background: rgba(255,255,255,0.9);
            border-radius: 16px;
            padding: 32px;
            border: 1px solid #e2e8f0;
        }
        h1 { margin-top: 0; }
        form {
            display: grid;
            gap: 18px;
        }
        .field {
            display: grid;
            gap: 8px;
        }
        label {
            font-weight: 700;
        }
        input, select, button {
            font: inherit;
        }
        input, select {
            padding: 10px 12px;
            border: 2px solid #c7d2fe;
            border-radius: 10px;
            background: #f8faff;
        }
        input:focus, select:focus {
            outline: 3px solid rgba(96, 165, 250, 0.35);
            border-color: #60a5fa;
        }
        button {
            width: fit-content;
            background: linear-gradient(135deg, #4f46e5, #7c3aed);
            color: white;
            border: none;
            border-radius: 999px;
            padding: 12px 24px;
            cursor: pointer;
            font-weight: 700;
        }
        a { color: #4f46e5; }
    </style>
</head>
<body>
    <main>
        <h1>Task 3 — Styled form controls</h1>

        <form>
            <div class="field">
                <label for="username">Username</label>
                <input id="username" name="username" type="text" placeholder="Enter username">
            </div>

            <div class="field">
                <label for="course">Course</label>
                <select id="course" name="course">
                    <option value="">Select a course</option>
                    <option>Web Programming</option>
                    <option>Database</option>
                    <option>UI/UX</option>
                </select>
            </div>

            <button type="submit">Continue</button>
        </form>

        <p><a href="index.html">Back to Week 6</a></p>
    </main>
</body>
</html>
