<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Week 7 Task 2 - Loading Message</title>
    <style>
        body { margin: 0; padding: 32px 18px; background: #f2f6f2; color: #172b3a; font-family: "Trebuchet MS", sans-serif; }
        main { max-width: 560px; margin: auto; }
        section { padding: 28px; border: 2px solid #31869a; border-radius: 8px; background: #fffdf7; }
        h1 { font: 500 2rem Georgia, serif; }
        #joke { min-height: 48px; font: 1.3rem/1.5 Georgia, serif; }
        #status { min-height: 24px; color: #5b6d78; }
        button { display: flex; width: 100%; min-height: 58px; align-items: center; justify-content: center; padding: 14px 20px; border: 1px solid #e2e8f0; border-radius: 14px; background: #fff; color: #222; box-shadow: 0 3px 8px rgba(0, 0, 0, .08); font: inherit; font-size: 1rem; font-weight: 600; cursor: pointer; transition: background-color .2s ease, transform .2s ease, box-shadow .2s ease; }
        button:hover:not(:disabled) { background: #e9e9eb; transform: translateY(-2px); box-shadow: 0 6px 12px rgba(0, 0, 0, .1); }
        button:focus-visible { outline: 3px solid #31869a; outline-offset: 3px; }
        button:disabled { opacity: .6; cursor: wait; }
        a { display: inline-block; margin-top: 20px; color: #176578; }
        @media (max-width: 520px) { button { min-height: 56px; } }
    </style>
</head>
<body>
    <main>
        <section>
            <p>Week 7 · Task 2</p>
            <h1>Show a loading message</h1>
            <p id="joke">Your joke will appear here.</p>
            <p id="status" role="status" aria-live="polite">Ready.</p>
            <button id="load-joke" type="button">Get a joke</button>
        </section>
        <a href="index.html">Back to Week 7 tasks</a>
    </main>
    <script>
        const button = document.querySelector('#load-joke');
        button.addEventListener('click', async () => {
            const status = document.querySelector('#status');
            button.disabled = true;
            status.textContent = 'Loading...';
            const response = await fetch('https://official-joke-api.appspot.com/random_joke');
            const joke = await response.json();
            document.querySelector('#joke').textContent = `${joke.setup} ${joke.punchline}`;
            status.textContent = 'Joke loaded.';
            button.disabled = false;
        });
    </script>
</body>
</html>
