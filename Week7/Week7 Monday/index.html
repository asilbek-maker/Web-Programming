<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Search books from the Open Library catalog.">
    <title>Week 7 Monday - Book Finder</title>
    <style>
        :root {
            color-scheme: light;
            --background: #f2f6f2;
            --surface: #fffdf7;
            --surface-raised: #f5f2e8;
            --text: #172b3a;
            --muted: #5b6d78;
            --accent: #31869a;
            --accent-hover: #276e7e;
            --border: #31869a;
            --error: #a43d38;
        }

        * { box-sizing: border-box; }

        body {
            min-height: 100vh;
            margin: 0;
            padding: 40px 22px 56px;
            background: var(--background);
            color: var(--text);
            font-family: "Trebuchet MS", sans-serif;
        }

        main { width: min(100%, 1120px); margin: 0 auto; }
        .eyebrow { margin: 0 0 12px; color: var(--accent); font-size: .85rem; font-weight: 700; letter-spacing: .16em; text-transform: uppercase; }
        h1 { margin: 0; font: 500 clamp(2.25rem, 6vw, 3rem) Georgia, serif; }
        .intro { max-width: 620px; margin: 14px 0 28px; color: var(--muted); font-size: 1.1rem; line-height: 1.6; }

        .search-panel {
            display: flex;
            gap: 12px;
            padding: 18px;
            border: 2px solid var(--accent);
            border-radius: 8px;
            background: var(--surface);
        }

        .search-panel label { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; }
        .search-panel input {
            min-width: 0;
            min-height: 52px;
            flex: 1;
            padding: 0 16px;
            border: 1px solid #9ab9bd;
            border-radius: 6px;
            background: #fff;
            color: var(--text);
            font: inherit;
            font-size: 1rem;
        }
        .search-panel input::placeholder { color: #70868e; }
        .search-panel input:focus-visible, button:focus-visible, a:focus-visible { outline: 3px solid var(--accent-hover); outline-offset: 3px; }

        button {
            min-height: 52px;
            padding: 0 22px;
            border: 1px solid #e2e8f0;
            border-radius: 6px;
            background: #fff;
            color: #222;
            box-shadow: 0 3px 8px rgba(0, 0, 0, .08);
            font: inherit;
            font-weight: 700;
            cursor: pointer;
            transition: background-color .2s ease, transform .2s ease, box-shadow .2s ease;
        }
        button:hover:not(:disabled) { background: #e9e9eb; transform: translateY(-2px); box-shadow: 0 6px 12px rgba(0, 0, 0, .1); }
        button:disabled { cursor: wait; opacity: .65; }

        #status { min-height: 28px; margin: 20px 2px; color: var(--muted); line-height: 1.5; }
        #status.error { color: var(--error); }
        .results { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 235px), 1fr)); gap: 18px; }

        .book-card {
            min-width: 0;
            overflow: hidden;
            border: 2px solid var(--accent);
            border-radius: 8px;
            background: var(--surface);
        }
        .cover-wrap { display: grid; min-height: 210px; place-items: center; padding: 18px; background: #e8f0ed; }
        .cover { display: block; width: auto; max-width: 100%; height: 190px; object-fit: contain; }
        .cover-placeholder { color: var(--muted); font-size: .95rem; text-align: center; }
        .book-info { padding: 16px; }
        .book-info h2 { margin: 0 0 10px; font-size: 1.1rem; line-height: 1.4; }
        .book-info p { margin: 7px 0; color: var(--muted); line-height: 1.45; }
        .book-info a { display: inline-block; margin-top: 10px; color: #176578; font-weight: 700; text-underline-offset: 3px; }

        .skeleton { min-height: 330px; border-radius: 8px; background: linear-gradient(100deg, var(--surface) 30%, var(--surface-raised) 50%, var(--surface) 70%); background-size: 200% 100%; animation: shimmer 1.4s ease-in-out infinite; }
        @keyframes shimmer { to { background-position-x: -200%; } }
        .back-link { display: inline-block; margin-top: 36px; color: #176578; text-underline-offset: 4px; }

        @media (max-width: 540px) {
            body { padding: 28px 16px 40px; }
            .search-panel { flex-direction: column; padding: 14px; }
            button { width: 100%; }
        }
        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after { scroll-behavior: auto !important; animation-duration: .01ms !important; animation-iteration-count: 1 !important; }
        }
    </style>
</head>
<body>
    <main>
        <header>
            <p class="eyebrow">Week 7 Monday · Fetch &amp; Render</p>
            <h1>Book Finder</h1>
            <p class="intro">Search the Open Library catalog and explore books in a clean card layout.</p>
        </header>

        <form class="search-panel" id="search-form">
            <label for="search-input">Search books</label>
            <input id="search-input" name="q" type="search" placeholder="Try a title, author, or subject" minlength="2" required>
            <button id="search-button" type="submit">Search books</button>
        </form>

        <p id="status" role="status" aria-live="polite">Enter a search above to find books.</p>
        <section class="results" id="results" aria-label="Book search results"></section>
        <a class="back-link" href="../index.html">Back to Week 7</a>
    </main>

    <script>
        const form = document.querySelector('#search-form');
        const input = document.querySelector('#search-input');
        const button = document.querySelector('#search-button');
        const status = document.querySelector('#status');
        const results = document.querySelector('#results');
        let isLoading = false;

        function showPlaceholder(message) {
            results.replaceChildren();
            const placeholder = document.createElement('p');
            placeholder.className = 'cover-placeholder';
            placeholder.textContent = message;
            results.appendChild(placeholder);
        }

        function makeBookCard(book) {
            const card = document.createElement('article');
            card.className = 'book-card';

            const coverWrap = document.createElement('div');
            coverWrap.className = 'cover-wrap';
            if (Number.isInteger(book.cover_i)) {
                const cover = document.createElement('img');
                cover.className = 'cover';
                cover.src = `https://covers.openlibrary.org/b/id/${book.cover_i}-M.jpg`;
                cover.alt = `Cover of ${book.title || 'this book'}`;
                cover.loading = 'lazy';
                cover.addEventListener('error', () => {
                    const placeholder = document.createElement('span');
                    placeholder.className = 'cover-placeholder';
                    placeholder.textContent = 'Cover not available';
                    cover.replaceWith(placeholder);
                }, { once: true });
                coverWrap.appendChild(cover);
            } else {
                const placeholder = document.createElement('span');
                placeholder.className = 'cover-placeholder';
                placeholder.textContent = 'Cover not available';
                coverWrap.appendChild(placeholder);
            }

            const info = document.createElement('div');
            info.className = 'book-info';
            const title = document.createElement('h2');
            title.textContent = book.title || 'Untitled';
            info.appendChild(title);

            const author = document.createElement('p');
            const authors = Array.isArray(book.author_name) ? book.author_name.slice(0, 2).join(', ') : '';
            author.textContent = authors ? `By ${authors}` : 'Author unknown';
            info.appendChild(author);

            if (Number.isInteger(book.first_publish_year)) {
                const year = document.createElement('p');
                year.textContent = `First published ${book.first_publish_year}`;
                info.appendChild(year);
            }

            if (typeof book.key === 'string' && /^\/works\/[A-Za-z0-9]+$/.test(book.key)) {
                const link = document.createElement('a');
                link.href = `https://openlibrary.org${book.key}`;
                link.target = '_blank';
                link.rel = 'noopener noreferrer';
                link.textContent = 'View book details';
                info.appendChild(link);
            }

            card.append(coverWrap, info);
            return card;
        }

        form.addEventListener('submit', async (event) => {
            event.preventDefault();
            if (isLoading) return;

            const query = input.value.trim();
            if (query.length < 2) {
                status.classList.add('error');
                status.textContent = 'Enter at least 2 characters to search.';
                input.focus();
                return;
            }

            isLoading = true;
            button.disabled = true;
            input.disabled = true;
            status.classList.remove('error');
            status.textContent = 'Searching the catalog...';
            results.replaceChildren(...Array.from({ length: 6 }, () => {
                const skeleton = document.createElement('div');
                skeleton.className = 'skeleton';
                skeleton.setAttribute('aria-hidden', 'true');
                return skeleton;
            }));

            try {
                const params = new URLSearchParams({ q: query, limit: '12' });
                const response = await fetch(`https://openlibrary.org/search.json?${params}`);
                if (!response.ok) throw new Error(`Book search failed with status ${response.status}`);

                const data = await response.json();
                if (!data || !Array.isArray(data.docs)) throw new Error('The book search returned an unexpected response.');

                const books = data.docs.filter((book) => book && typeof book === 'object');
                if (books.length === 0) {
                    showPlaceholder('No books found. Try a different title or author.');
                    status.textContent = 'No books found.';
                    return;
                }

                results.replaceChildren(...books.map(makeBookCard));
                status.textContent = `Showing ${books.length} ${books.length === 1 ? 'book' : 'books'} for “${query}”.`;
            } catch (error) {
                showPlaceholder('Search results could not be displayed.');
                status.classList.add('error');
                status.textContent = 'Could not load books. Check your connection and try again.';
                console.error('Book search failed:', error);
            } finally {
                isLoading = false;
                button.disabled = false;
                input.disabled = false;
                input.focus();
            }
        });
    </script>
</body>
</html>
