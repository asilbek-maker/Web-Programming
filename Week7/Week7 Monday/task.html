<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Work through a step of the Week 7 Monday Book Finder.">
    <title>Week 7 Monday - Book Finder Exercise</title>
    <style>
        :root {
            color-scheme: light;
            --background: #f3f3f6;
            --surface: #fff;
            --text: #111;
            --muted: #666;
            --border: #e2e8f0;
            --accent: #31869a;
        }
        * { box-sizing: border-box; }
        body { min-height: 100vh; margin: 0; padding: 32px 18px; background: var(--background); color: var(--text); font-family: Arial, sans-serif; }
        main { width: min(100%, 820px); margin: 0 auto; }
        .eyebrow { margin: 0 0 8px; color: var(--muted); }
        h1 { margin: 0 0 20px; font-size: clamp(2rem, 5vw, 2.6rem); }
        .lesson, .code-panel { margin: 20px 0; padding: 28px; border: 1px solid var(--border); border-radius: 24px; background: var(--surface); box-shadow: 0 3px 8px rgba(0, 0, 0, .08); }
        .lesson h2, .code-panel h2 { margin: 0 0 12px; font-size: 1.25rem; }
        .lesson p { margin: 0; color: var(--muted); font-size: 1.05rem; line-height: 1.55; }
        pre { margin: 0; overflow-x: auto; color: #222; font: .95rem/1.6 Consolas, "Courier New", monospace; white-space: pre-wrap; overflow-wrap: anywhere; }
        .navigation { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 12px; margin-top: 24px; }
        .navigation a { display: inline-flex; min-height: 52px; align-items: center; justify-content: center; padding: 12px 20px; border: 1px solid var(--border); border-radius: 14px; background: var(--surface); color: #222; font-weight: 600; text-align: center; text-decoration: none; box-shadow: 0 3px 8px rgba(0, 0, 0, .08); }
        .navigation a[hidden] { display: none; }
        .navigation a:hover { background: #e9e9eb; }
        a:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }
        @media (max-width: 520px) {
            body { padding: 24px 14px; }
            .lesson, .code-panel { padding: 20px; }
            .navigation { flex-direction: column; }
            .navigation a { width: 100%; }
        }
    </style>
</head>
<body>
    <main>
        <header>
            <p class="eyebrow" id="step-label">Week 7 Monday</p>
            <h1 id="step-title">Book Finder Exercise</h1>
        </header>
        <section class="lesson" aria-labelledby="goal-heading">
            <h2 id="goal-heading">What to do</h2>
            <p id="step-description"></p>
        </section>
        <section class="code-panel" aria-labelledby="example-heading">
            <h2 id="example-heading">Key idea</h2>
            <pre><code id="step-example"></code></pre>
        </section>
        <nav class="navigation" aria-label="Exercise navigation">
            <a href="index.html">Back to Monday exercises</a>
            <a id="previous-step" href="#" hidden>Previous exercise</a>
            <a id="next-step" href="#" hidden>Next exercise</a>
            <a href="index.html#bonus-heading">Open the bonus Book Finder</a>
        </nav>
    </main>
    <script>
        const steps = [
            {
                title: 'Exercise 1 — HTML Structure',
                description: 'Build the semantic foundation: a page header, a search form with a labeled input, a live status message, and a section where book results will appear.',
                example: '<header><h1>Book Finder</h1></header>\n<form id="search-form">\n  <label for="search-input">Search books</label>\n  <input id="search-input" type="search" required>\n  <button type="submit">Search books</button>\n</form>\n<p id="status" role="status" aria-live="polite"></p>\n<section id="results" aria-label="Book search results"></section>'
            },
            {
                title: 'Exercise 2 — CSS Layout & Cards',
                description: 'Style the form as a flexible row and use a responsive grid for results. Each book card should remain readable on both narrow and wide screens.',
                example: '.search-panel {\n  display: flex;\n  gap: 24px;\n}\n.results {\n  display: grid;\n  grid-template-columns: repeat(\n    auto-fit,\n    minmax(min(100%, 235px), 1fr)\n  );\n  gap: 18px;\n}'
            },
            {
                title: 'Exercise 3 — JS DOM: Wire the Form',
                description: 'Listen for the form submit event, prevent a page reload, and read the trimmed search text before starting a search.',
                example: 'form.addEventListener("submit", (event) => {\n  event.preventDefault();\n  const query = input.value.trim();\n  if (query.length < 2) {\n    status.textContent = "Enter at least 2 characters.";\n    return;\n  }\n  searchBooks(query);\n});'
            },
            {
                title: 'Exercise 4 — Fetch: Call the API',
                description: 'Request matching books from Open Library. Check that the HTTP request succeeded before parsing the JSON response.',
                example: 'const params = new URLSearchParams({\n  q: query,\n  limit: "12"\n});\nconst response = await fetch(\n  `https://openlibrary.org/search.json?${params}`\n);\nif (!response.ok) throw new Error("Book search failed");\nconst data = await response.json();'
            },
            {
                title: 'Challenge — Render: Display Cards',
                description: 'Turn each result into a book card. Use textContent for API-provided text, then append the finished cards to the results section.',
                example: 'const card = document.createElement("article");\ncard.className = "book-card";\nconst title = document.createElement("h2");\ntitle.textContent = book.title || "Untitled";\ncard.append(title);\nresults.append(card);'
            },
            {
                title: 'Extra — Loading & Errors',
                description: 'Show a loading state while searching, disable the form to prevent duplicate requests, handle an empty result, and always restore the controls.',
                example: 'button.disabled = true;\nstatus.textContent = "Searching...";\ntry {\n  const data = await fetchBooks(query);\n  renderBooks(data.docs);\n} catch (error) {\n  status.textContent = "Could not load books. Try again.";\n  console.error(error);\n} finally {\n  button.disabled = false;\n}'
            }
        ];

        const requestedStep = Number(new URLSearchParams(window.location.search).get('step'));
        const stepIndex = Number.isInteger(requestedStep) && requestedStep >= 1 && requestedStep <= steps.length
            ? requestedStep - 1
            : 0;
        const step = steps[stepIndex];

        document.title = `Week 7 Monday - ${step.title}`;
        document.getElementById('step-label').textContent = `Week 7 Monday · Task ${stepIndex + 1} of ${steps.length}`;
        document.getElementById('step-title').textContent = step.title;
        document.getElementById('step-description').textContent = step.description;
        document.getElementById('step-example').textContent = step.example;

        if (stepIndex > 0) {
            const previous = document.getElementById('previous-step');
            previous.href = `?step=${stepIndex}`;
            previous.hidden = false;
        }
        if (stepIndex < steps.length - 1) {
            const next = document.getElementById('next-step');
            next.href = `?step=${stepIndex + 2}`;
            next.hidden = false;
        }
    </script>
</body>
</html>
