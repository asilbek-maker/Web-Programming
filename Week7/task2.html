<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Week 7 Task 2 - Loading Message</title>
    <style>
        body { margin: 0; padding: 32px 18px; background: #f2f6f2; color: #172b3a; font-family: "Trebuchet MS", sans-serif; }
        main { max-width: 640px; margin: auto; }
        section { padding: 28px; border: 2px solid #31869a; border-radius: 8px; background: #fffdf7; }
        h1 { font: 500 2rem Georgia, serif; }
        #joke { min-height: 48px; font: 1.3rem/1.5 Georgia, serif; }
        #status { min-height: 24px; color: #5b6d78; }
        button { padding: 12px 18px; border: 2px solid #31869a; border-radius: 6px; background: #dff2f5; color: #172b3a; font: inherit; font-weight: bold; cursor: pointer; }
        button:disabled { opacity: .6; cursor: wait; }
        a { display: inline-block; margin-top: 20px; color: #176578; }
    </style>
</head>
<body>
    <main>
        <section>
            <p>Week 7 · Task 2</p>
            <h1>Show a loading message</h1>
            <p id="joke">Your joke will appear here.</p>
            <p id="status" role="status" aria-live="polite">Ready.</p>
            <button id="load-joke" type="button">Get a joke</button>
        </section>
        <a href="index.html">Back to Week 7 tasks</a>
    </main>
    <script>
        const button = document.querySelector('#load-joke');
        button.addEventListener('click', async () => {
            const status = document.querySelector('#status');
            button.disabled = true;
            status.textContent = 'Loading...';
            const response = await fetch('https://official-joke-api.appspot.com/random_joke');
            const joke = await response.json();
            document.querySelector('#joke').textContent = `${joke.setup} ${joke.punchline}`;
            status.textContent = 'Joke loaded.';
            button.disabled = false;
        });
    </script>
</body>
</html>
