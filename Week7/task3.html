<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Week 7 Task 3 - Separate Joke Parts</title>
    <style>
        body { margin: 0; padding: 32px 18px; background: #f2f6f2; color: #172b3a; font-family: "Trebuchet MS", sans-serif; }
        main { max-width: 640px; margin: auto; }
        section { padding: 28px; border: 2px solid #31869a; border-radius: 8px; background: #fffdf7; }
        h1 { font: 500 2rem Georgia, serif; }
        #setup { min-height: 48px; font: 1.4rem/1.4 Georgia, serif; }
        #punchline { min-height: 28px; color: #a45524; font-weight: bold; }
        #status { min-height: 24px; color: #5b6d78; }
        button { display: flex; width: 100%; min-height: 110px; align-items: center; justify-content: center; padding: 18px 24px; border: 0; border-radius: 20px; background: #fff; color: #222; box-shadow: 0 5px 14px rgba(0, 0, 0, .1); font: inherit; font-size: 1.8rem; font-weight: 700; cursor: pointer; transition: background-color .2s ease, transform .2s ease, box-shadow .2s ease; }
        button:hover:not(:disabled) { background: #e9e9eb; transform: translateY(-3px); box-shadow: 0 8px 18px rgba(0, 0, 0, .12); }
        button:focus-visible { outline: 3px solid #31869a; outline-offset: 3px; }
        button:disabled { opacity: .6; cursor: wait; }
        a { display: inline-block; margin-top: 20px; color: #176578; }
        @media (max-width: 520px) { button { min-height: 92px; font-size: 1.4rem; } }
    </style>
</head>
<body>
    <main>
        <section>
            <p>Week 7 · Task 3</p>
            <h1>Setup and punchline</h1>
            <p id="setup">The setup will appear here.</p>
            <p id="punchline"></p>
            <p id="status" role="status" aria-live="polite">Ready.</p>
            <button id="load-joke" type="button">Get a joke</button>
        </section>
        <a href="index.html">Back to Week 7 tasks</a>
    </main>
    <script>
        const button = document.querySelector('#load-joke');
        button.addEventListener('click', async () => {
            const status = document.querySelector('#status');
            button.disabled = true;
            status.textContent = 'Loading...';
            const response = await fetch('https://official-joke-api.appspot.com/random_joke');
            const joke = await response.json();
            document.querySelector('#setup').textContent = joke.setup;
            document.querySelector('#punchline').textContent = joke.punchline;
            status.textContent = 'Joke loaded.';
            button.disabled = false;
        });
    </script>
</body>
</html>
