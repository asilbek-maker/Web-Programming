<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Week 7 Task 5 - Spinner</title>
    <style>
        body { margin: 0; padding: 32px 18px; background: #f2f6f2; color: #172b3a; font-family: "Trebuchet MS", sans-serif; }
        main { max-width: 640px; margin: auto; }
        section { padding: 28px; border: 2px solid #31869a; border-radius: 8px; background: #fffdf7; }
        h1 { font: 500 2rem Georgia, serif; }
        #setup { min-height: 48px; font: 1.4rem/1.4 Georgia, serif; }
        #punchline { min-height: 28px; color: #a45524; font-weight: bold; }
        #status { display: flex; min-height: 24px; align-items: center; gap: 10px; color: #5b6d78; }
        #status.error { color: #a43d38; }
        .spinner { display: none; width: 18px; height: 18px; flex: 0 0 auto; border: 3px solid #c7e3e6; border-top-color: #31869a; border-radius: 50%; animation: spin .75s linear infinite; }
        .loading .spinner { display: inline-block; }
        @keyframes spin { to { transform: rotate(360deg); } }
        button { padding: 12px 18px; border: 2px solid #31869a; border-radius: 6px; background: #dff2f5; color: #172b3a; font: inherit; font-weight: bold; cursor: pointer; }
        button:disabled { opacity: .6; cursor: wait; }
        a { display: inline-block; margin-top: 20px; color: #176578; }
        @media (prefers-reduced-motion: reduce) { .spinner { animation-duration: .01ms; } }
    </style>
</head>
<body>
    <main>
        <section id="panel">
            <p>Week 7 · Challenge</p>
            <h1>Loading spinner</h1>
            <p id="setup">The setup will appear here.</p>
            <p id="punchline"></p>
            <p id="status" role="status" aria-live="polite"><span class="spinner" aria-hidden="true"></span><span id="status-text">Ready.</span></p>
            <button id="load-joke" type="button">Get a joke</button>
        </section>
        <a href="index.html">Back to Week 7 tasks</a>
    </main>
    <script>
        const button = document.querySelector('#load-joke');
        const panel = document.querySelector('#panel');
        const status = document.querySelector('#status');
        const statusText = document.querySelector('#status-text');
        button.addEventListener('click', async () => {
            button.disabled = true;
            panel.classList.add('loading');
            status.classList.remove('error');
            statusText.textContent = 'Loading...';
            try {
                const response = await fetch('https://official-joke-api.appspot.com/random_joke');
                if (!response.ok) throw new Error('Request failed');
                const joke = await response.json();
                document.querySelector('#setup').textContent = joke.setup;
                document.querySelector('#punchline').textContent = joke.punchline;
                statusText.textContent = 'Joke loaded.';
            } catch {
                status.classList.add('error');
                statusText.textContent = 'Sorry, we could not load a joke. Check your connection and try again.';
            } finally {
                panel.classList.remove('loading');
                button.disabled = false;
            }
        });
    </script>
</body>
</html>
