<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Week 7 Task 6 - Favorite Joke</title>
    <style>
        body { margin: 0; padding: 32px 18px; background: #f2f6f2; color: #172b3a; font-family: "Trebuchet MS", sans-serif; }
        main { max-width: 640px; margin: auto; }
        section { margin-bottom: 18px; padding: 26px; border: 2px solid #31869a; border-radius: 8px; background: #fffdf7; }
        .favorite { border-color: #c97925; background: #fff0d7; }
        h1, h2 { font: 500 1.8rem Georgia, serif; }
        #setup { min-height: 48px; font: 1.3rem/1.4 Georgia, serif; }
        #punchline, #favorite-punchline { min-height: 24px; color: #a45524; font-weight: bold; }
        #status { display: flex; min-height: 24px; align-items: center; gap: 10px; color: #5b6d78; }
        #status.error { color: #a43d38; }
        .spinner { display: none; width: 18px; height: 18px; flex: 0 0 auto; border: 3px solid #c7e3e6; border-top-color: #31869a; border-radius: 50%; animation: spin .75s linear infinite; }
        .loading .spinner { display: inline-block; }
        @keyframes spin { to { transform: rotate(360deg); } }
        .actions { display: grid; gap: 16px; }
        button { display: flex; width: 100%; min-height: 110px; align-items: center; justify-content: center; padding: 18px 24px; border: 0; border-radius: 20px; background: #fff; color: #222; box-shadow: 0 5px 14px rgba(0, 0, 0, .1); font: inherit; font-size: 1.8rem; font-weight: 700; cursor: pointer; transition: background-color .2s ease, transform .2s ease, box-shadow .2s ease; }
        button:hover:not(:disabled) { background: #e9e9eb; transform: translateY(-3px); box-shadow: 0 8px 18px rgba(0, 0, 0, .12); }
        button:focus-visible { outline: 3px solid #31869a; outline-offset: 3px; }
        button:disabled { opacity: .6; cursor: wait; }
        a { display: inline-block; margin-top: 4px; color: #176578; }
        @media (max-width: 520px) { body { padding: 22px 14px; } button { min-height: 92px; font-size: 1.4rem; } }
        @media (prefers-reduced-motion: reduce) { .spinner { animation-duration: .01ms; } }
    </style>
</head>
<body>
    <main>
        <section id="panel">
            <p>Week 7 · Extra</p>
            <h1>Save a favorite joke</h1>
            <p id="setup">The setup will appear here.</p>
            <p id="punchline"></p>
            <p id="status" role="status" aria-live="polite"><span class="spinner" aria-hidden="true"></span><span id="status-text">Ready.</span></p>
            <div class="actions">
                <button id="load-joke" type="button">Get a joke</button>
                <button id="save-favorite" type="button" disabled>Save favorite</button>
            </div>
        </section>
        <section class="favorite">
            <h2>Your saved joke</h2>
            <p id="favorite-setup">No favorite saved yet.</p>
            <p id="favorite-punchline"></p>
            <button id="remove-favorite" type="button" hidden>Remove favorite</button>
        </section>
        <a href="index.html">Back to Week 7 tasks</a>
    </main>
    <script>
        const favoriteKey = 'week7-favorite-joke';
        const jokeButton = document.querySelector('#load-joke');
        const saveButton = document.querySelector('#save-favorite');
        const removeButton = document.querySelector('#remove-favorite');
        const panel = document.querySelector('#panel');
        const status = document.querySelector('#status');
        const statusText = document.querySelector('#status-text');
        let currentJoke = null;

        function showFavorite() {
            let favorite;
            try {
                favorite = JSON.parse(localStorage.getItem(favoriteKey));
            } catch {
                localStorage.removeItem(favoriteKey);
            }
            if (favorite && typeof favorite.setup === 'string' && typeof favorite.punchline === 'string') {
                document.querySelector('#favorite-setup').textContent = favorite.setup;
                document.querySelector('#favorite-punchline').textContent = favorite.punchline;
                removeButton.hidden = false;
            } else {
                document.querySelector('#favorite-setup').textContent = 'No favorite saved yet.';
                document.querySelector('#favorite-punchline').textContent = '';
                removeButton.hidden = true;
            }
        }

        jokeButton.addEventListener('click', async () => {
            jokeButton.disabled = true;
            saveButton.disabled = true;
            panel.classList.add('loading');
            status.classList.remove('error');
            statusText.textContent = 'Loading...';
            try {
                const response = await fetch('https://official-joke-api.appspot.com/random_joke');
                if (!response.ok) throw new Error('Request failed');
                const joke = await response.json();
                if (typeof joke.setup !== 'string' || typeof joke.punchline !== 'string') throw new Error('Invalid joke');
                currentJoke = { setup: joke.setup, punchline: joke.punchline };
                document.querySelector('#setup').textContent = currentJoke.setup;
                document.querySelector('#punchline').textContent = currentJoke.punchline;
                statusText.textContent = 'Joke loaded.';
                saveButton.disabled = false;
            } catch {
                status.classList.add('error');
                statusText.textContent = 'Sorry, we could not load a joke. Check your connection and try again.';
            } finally {
                panel.classList.remove('loading');
                jokeButton.disabled = false;
            }
        });

        saveButton.addEventListener('click', () => {
            if (!currentJoke) return;
            try {
                localStorage.setItem(favoriteKey, JSON.stringify(currentJoke));
                showFavorite();
                statusText.textContent = 'Favorite saved on this device.';
            } catch {
                status.classList.add('error');
                statusText.textContent = 'Could not save your favorite in this browser.';
            }
        });

        removeButton.addEventListener('click', () => {
            localStorage.removeItem(favoriteKey);
            showFavorite();
        });
        showFavorite();
    </script>
</body>
</html>
