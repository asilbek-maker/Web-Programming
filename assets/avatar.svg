<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-labelledby="t">
  <title id="t">Portrait of Asilbek</title>
  <defs>
    <clipPath id="c"><circle cx="100" cy="100" r="100"/></clipPath>
    <radialGradient id="bg" cx=".5" cy=".35" r=".75">
      <stop offset="0" stop-color="#e3e5ea"/>
      <stop offset="1" stop-color="#aeb2bb"/>
    </radialGradient>
    <linearGradient id="skin" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#c99673"/>
      <stop offset=".45" stop-color="#dcaa86"/>
      <stop offset="1" stop-color="#b9845f"/>
    </linearGradient>
    <linearGradient id="neck" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a8724f"/>
      <stop offset=".5" stop-color="#c08a66"/>
    </linearGradient>
    <linearGradient id="suit" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2a3547"/>
      <stop offset="1" stop-color="#161d29"/>
    </linearGradient>
    <linearGradient id="hair" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b2724"/>
      <stop offset="1" stop-color="#151311"/>
    </linearGradient>
  </defs>
  <g clip-path="url(#c)">
    <rect width="200" height="200" fill="url(#bg)"/>

    <!-- shoulders / suit jacket -->
    <path d="M10 200c3-34 18-52 48-60l22-6h40l22 6c30 8 45 26 48 60z" fill="url(#suit)"/>
    <!-- shirt -->
    <path d="M80 134l20 44 20-44-8-3H88z" fill="#eef0f3"/>
    <path d="M100 178l-9-22 9 6 9-6z" fill="#d9dce1"/>
    <!-- tie -->
    <path d="M96 143h8l2 5-3 36h-6l-3-36z" fill="#3a4659"/>
    <path d="M95.5 138h9l1.5 5h-12z" fill="#2f3a4b"/>
    <!-- lapels -->
    <path d="M78 134l22 44-17-9-10-30z" fill="#1d2636"/>
    <path d="M122 134l-22 44 17-9 10-30z" fill="#1d2636"/>

    <!-- neck with shadow under the jaw -->
    <path d="M86 108h28v24c0 6-6 10-14 10s-14-4-14-10z" fill="url(#neck)"/>

    <!-- ears -->
    <path d="M69 80c-6-2-9 3-8 10 1 8 5 13 10 13z" fill="#c08b68"/>
    <path d="M131 80c6-2 9 3 8 10-1 8-5 13-10 13z" fill="#b07a57"/>

    <!-- head: natural oval with jaw and chin -->
    <path d="M100 36c18 0 32 12 33 36 1 14-2 27-8 37-6 9-15 15-25 15s-19-6-25-15c-6-10-9-23-8-37 1-24 15-36 33-36z" fill="url(#skin)"/>
    <!-- soft shading: cheek/jaw shadow and chin -->
    <path d="M125 72c2 18-3 34-12 43-4 4-8 6-13 7 10-6 18-18 21-34 1-6 2-11 4-16z" fill="#a9734f" opacity=".35"/>
    <ellipse cx="100" cy="118" rx="10" ry="4" fill="#a9734f" opacity=".25"/>
    <!-- hair: short professional cut with side part -->
    <path d="M67 78c-3-27 11-46 34-46 23 0 37 17 33 46-1-8-4-15-9-20-6-6-14-8-23-8-11 0-21 2-28 7-4 5-6 12-7 21z" fill="url(#hair)"/>
    <path d="M85 44c10-4 24-4 35 2" fill="none" stroke="#3a3531" stroke-width="1.6" stroke-linecap="round" opacity=".7"/>
    <path d="M69 74c0-6 1-11 3-15" fill="none" stroke="#151311" stroke-width="3" stroke-linecap="round"/>
    <path d="M131 74c0-6-1-11-3-15" fill="none" stroke="#151311" stroke-width="3" stroke-linecap="round"/>
  </g>
</svg>
