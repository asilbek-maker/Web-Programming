<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web Programming Course</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f8fafc;
            color: #0f172a;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 600px;
            width: 100%;
            text-align: center;
        }

        .header {
            margin-bottom: 32px;
        }

        .header h1 {
            font-size: 2.25rem;
            font-weight: 800;
            color: #0f172a;
            margin-bottom: 8px;
            letter-spacing: -0.025em;
        }

        .header p {
            font-size: 1rem;
            color: #64748b;
        }

        .weeks {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .week-card {
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: #ffffff;
            color: #1e293b;
            text-decoration: none;
            font-size: 1.125rem;
            font-weight: 600;
            padding: 20px;
            border-radius: 16px;
            border: 1px solid #e2e8f0;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -2px rgba(0, 0, 0, 0.05);
            transition: all 0.2s ease-in-out;
        }

        .week-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -4px rgba(0, 0, 0, 0.05);
            border-color: #cbd5e1;
            background-color: #ffffff;
            color: #2563eb;
        }

        .footer {
            margin-top: 40px;
            font-size: 0.875rem;
            color: #94a3b8;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <h1>Web Programming</h1>
            <p>My Web Programming assignments and class exercises</p>
        </div>

        <div class="weeks">
            <a class="week-card" href="Week2/">Week 2</a>
            <a class="week-card" href="Week3/">Week 3</a>
            <a class="week-card" href="Week4/">Week 4</a>
            <a class="week-card" href="Week5/">Week 5</a>
        </div>

        <div class="footer">
            <p>Created by Asilbek</p>
        </div>
    </div>
</body>
</html>
