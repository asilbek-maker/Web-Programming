<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: sans-serif;
      background-color: #f1f5f9;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .card {
      background-color: #ffffff;
      padding: 24px;
      border-radius: 12px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -2px rgba(0, 0, 0, 0.1);
      width: 300px;
      text-align: center;
    }

    .avatar {
      width: 80px;
      height: 80px;
      background-color: #10b981;
      color: #ffffff;
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 2rem;
      font-weight: bold;
      margin: 0 auto 16px auto;
    }

    .name {
      font-size: 1.5rem;
      font-weight: bold;
      color: #0f172a;
      margin-bottom: 4px;
    }

    .role {
      color: #64748b;
      font-size: 0.95rem;
      margin-bottom: 16px;
    }

    hr {
      border: none;
      border-top: 1px solid #e2e8f0;
      margin: 16px 0;
    }

    .skills {
      display: flex;
      justify-content: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .badge {
      background-color: #10b981;
      color: #ffffff;
      padding: 6px 14px;
      border-radius: 9999px;
      font-size: 0.85rem;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="avatar">A</div>
    <h2 class="name">Asilbek</h2>
    <p class="role">Web Programming Student</p>
    <hr>
    <div class="skills">
      <span class="badge">HTML5</span>
      <span class="badge">Python</span>
      <span class="badge">GitHub</span>
    </div>
  </div>
</body>
</html>
